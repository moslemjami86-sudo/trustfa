version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustfa
      POSTGRES_PASSWORD: trustfa
      POSTGRES_DB: trustfa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustfa -d trustfa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://trustfa:trustfa@db:5432/trustfa
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./frontend:/app/frontend
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
